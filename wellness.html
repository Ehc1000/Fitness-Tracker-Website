<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/javascript.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wellness Tracker - Fitness App</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header>
      <img src="/images/dumbbell.jpg" alt="Dumbbell" />
      <h1>Wellness Tracker</h1>
    </header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="workouts.html">Workouts</a></li>
        <li><a href="meals.html">Meals</a></li>
        <li><a href="bmi.html">BMI</a></li>
        <li><a href="wellness.html" class="active">Wellness</a></li>
        <li><a href="game.html">Game</a></li>
      </ul>
    </nav>
    <main>
      <div id="mood-tracker-container" class="tracker-card">
        <h2>How are you feeling today?</h2>
        <div class="mood-options">
          <button class="mood-btn" data-mood="great">
            <span>🤩</span>
            <span class="mood-label">Great</span>
          </button>
          <button class="mood-btn" data-mood="good">
            <span>😊</span>
            <span class="mood-label">Good</span>
          </button>
          <button class="mood-btn" data-mood="okay">
            <span>😐</span>
            <span class="mood-label">Okay</span>
          </button>
          <button class="mood-btn" data-mood="tired">
            <span>😴</span>
            <span class="mood-label">Tired</span>
          </button>
          <button class="mood-btn" data-mood="stressed">
            <span>😫</span>
            <span class="mood-label">Stressed</span>
          </button>
        </div>
        <p id="mood-status">Select your mood to log it for today!</p>
      </div>

      <div id="water-tracker-container" class="tracker-card">
        <h2>Water Intake</h2>
        <div class="water-controls">
          <button id="remove-water-btn" class="btn-primary" style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem;">-</button>
          <span id="water-count" style="font-size: 1.5rem; margin: 0 1rem;">0</span> / <span id="water-goal">8</span> glasses
          <button id="add-water-btn" class="btn-primary" style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.5rem;">+</button>
        </div>
        <div class="input-group" style="margin-top: 1.5rem;">
          <input type="number" id="water-goal-input" placeholder="Goal..." class="input-small" />
          <button id="set-water-goal-btn" class="btn-primary">Set Goal</button>
          <button id="reset-water-btn" class="btn-danger">Reset</button>
        </div>
        <div class="progress-bar-container">
          <div id="water-progress-bar" class="progress-bar progress-water"></div>
        </div>
        <p>Stay hydrated!</p>
      </div>

      <div id="sleep-tracker-container" class="tracker-card">
        <h2>Sleep Tracker</h2>
        <div class="input-group">
          <input type="number" id="sleep-input" step="0.5" placeholder="Hours slept" class="input-small" style="width: 150px;" />
          <button id="add-sleep-btn" class="btn-primary">Log Sleep</button>
        </div>
        <div id="sleep-progress-container">
          <p><span id="current-sleep">0</span> / <span id="sleep-goal">8</span> hours</p>
          <div class="progress-bar-container">
            <div id="sleep-progress-bar" class="progress-bar progress-sleep"></div>
          </div>
        </div>
      </div>

      <div id="step-tracker-container" class="tracker-card">
        <h2>Step Tracker</h2>
        <div class="input-group">
          <input type="number" id="step-input" step="100" placeholder="Steps taken" class="input-small" style="width: 150px;" />
          <button id="add-step-btn" class="btn-primary">Log Steps</button>
        </div>
        <div id="step-progress-container">
          <p><span id="current-steps">0</span> / <span id="step-goal">10000</span> steps</p>
          <div class="progress-bar-container">
            <div id="step-progress-bar" class="progress-bar progress-steps"></div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Fitness Tracker</p>
    </footer>
    <script type="module" src="/src/js/wellness.js"></script>
  </body>
</html>
