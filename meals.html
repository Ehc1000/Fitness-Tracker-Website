<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/javascript.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meals - Fitness Tracker</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header>
      <img src="/images/dumbbell.jpg" alt="Dumbbell" />
      <h1>Fitness Tracker</h1>
    </header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="workouts.html">Workouts</a></li>
        <li><a href="meals.html" class="active">Meals</a></li>
        <li><a href="bmi.html">BMI</a></li>
        <li><a href="wellness.html">Wellness</a></li>
        <li><a href="game.html">Game</a></li>
      </ul>
    </nav>
    <main>
      <div id="calorie-goal-container">
        <h2>Daily Calorie Goal</h2>
        <form id="calorie-goal-form">
          <input type="number" id="calorie-goal-input" placeholder="Enter your daily calorie goal" />
          <button type="submit">Set Goal</button>
        </form>
        <div id="calorie-progress-container">
          <h3>Today's Progress</h3>
          <p><span id="current-calories">0</span> / <span id="calorie-goal">2000</span> kcal</p>
          <p>Remaining: <span id="remaining-calories">0</span> kcal</p>
          <div id="calorie-progress-bar-container">
            <div id="calorie-progress-bar"></div>
          </div>
        </div>
      </div>

      <div id="quick-add-container" class="tracker-card">
        <h2>Quick Add</h2>
        <div class="food-icons">
          <button class="quick-add-btn" data-food="Apple" data-calories="95">
            <img src="/images/foods/apple.svg" alt="Apple" />
            <span>Apple</span>
          </button>
          <button class="quick-add-btn" data-food="Banana" data-calories="105">
            <img src="/images/foods/banana.svg" alt="Banana" />
            <span>Banana</span>
          </button>
          <button class="quick-add-btn" data-food="Strawberry" data-calories="4">
            <img src="/images/foods/strawberry.svg" alt="Strawberry" />
            <span>Strawberry</span>
          </button>
          <button class="quick-add-btn" data-food="Broccoli" data-calories="31">
            <img src="/images/foods/broccoli.svg" alt="Broccoli" />
            <span>Broccoli</span>
          </button>
          <button class="quick-add-btn" data-food="Carrot" data-calories="25">
            <img src="/images/foods/carrot.svg" alt="Carrot" />
            <span>Carrot</span>
          </button>
          <button class="quick-add-btn" data-food="Pizza" data-calories="285">
            <img src="/images/foods/pizza.svg" alt="Pizza" />
            <span>Pizza</span>
          </button>
          <button class="quick-add-btn" data-food="Burger" data-calories="354">
            <img src="/images/foods/burger.svg" alt="Burger" />
            <span>Burger</span>
          </button>
          <button class="quick-add-btn" data-food="Fries" data-calories="312">
            <img src="/images/foods/fries.svg" alt="Fries" />
            <span>Fries</span>
          </button>
          <button class="quick-add-btn" data-food="Donut" data-calories="250">
            <img src="/images/foods/donut.svg" alt="Donut" />
            <span>Donut</span>
          </button>
          <button class="quick-add-btn" data-food="Ice Cream" data-calories="137">
            <img src="/images/foods/ice-cream.svg" alt="Ice Cream" />
            <span>Ice Cream</span>
          </button>
        </div>
      </div>

      <div class="loader"></div>
    </main>
    <footer>
      <p>&copy; 2025 Fitness Tracker</p>
    </footer>
    <script type="module" src="/src/js/meals.js"></script>
  </body>
</html>
